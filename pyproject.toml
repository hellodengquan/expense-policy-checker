[project]
name = "expense-policy-checker"
version = "1.0.0"
description = "财务报销规则检查 CLI 工具"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "PyYAML>=6.0",
]

[project.scripts]
expense-checker = "expense_checker.cli:app"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["expense_checker*"]

[tool.setuptools.package-data]
expense_checker = ["config/*.yaml", "config/*.yml"]

