version: "1.0.0"
name: "公司财务报销政策"
last_updated: "2025-01-01"

rules:
  amount_limits:
    rule_id: "R001"
    rule_name: "单笔/单类金额上限"
    description: "根据职级设定不同费用类型的单笔/月度报销上限"

    per_transaction_limits:
      intern:
        meal: 80.0
        transportation: 200.0
        accommodation: 400.0
        entertainment: 300.0
      junior:
        meal: 120.0
        transportation: 500.0
        accommodation: 600.0
        entertainment: 800.0
      middle:
        meal: 200.0
        transportation: 1000.0
        accommodation: 1000.0
        entertainment: 1500.0
      senior:
        meal: 300.0
        transportation: 2000.0
        accommodation: 1500.0
        entertainment: 3000.0
      manager:
        meal: 400.0
        transportation: 3000.0
        accommodation: 2500.0
        entertainment: 5000.0
      director:
        meal: 600.0
        transportation: 5000.0
        accommodation: 4000.0
        entertainment: 10000.0
      vp:
        meal: 1000.0
        transportation: 10000.0
        accommodation: 8000.0
        entertainment: 20000.0

    monthly_limits:
      intern: 2000.0
      junior: 5000.0
      middle: 10000.0
      senior: 20000.0
      manager: 50000.0
      director: 100000.0
      vp: 500000.0

  receipt_required:
    rule_id: "R002"
    rule_name: "发票要求"
    description: "超过一定金额必须提供发票"
    threshold: 200.0

  meal_per_day_limit:
    rule_id: "R003"
    rule_name: "每日餐费上限"
    description: "单日餐费报销总额不得超过上限"
    limits:
      intern: 150.0
      junior: 250.0
      middle: 400.0
      senior: 600.0
      manager: 800.0
      director: 1200.0
      vp: 2000.0

  travel_accommodation_city_tier:
    rule_id: "R004"
    rule_name: "出差住宿城市分级标准"
    description: "根据出差城市级别设定住宿标准"
    tier1_cities:
      - "北京"
      - "上海"
      - "广州"
      - "深圳"
      - "杭州"
    tier2_cities:
      - "成都"
      - "重庆"
      - "武汉"
      - "南京"
      - "西安"
      - "苏州"
      - "天津"
      - "厦门"
    multipliers:
      tier1: 1.5
      tier2: 1.2
      tier3: 1.0

  entertainment_requirements:
    rule_id: "R005"
    rule_name: "招待费特殊要求"
    description: "招待费必须注明参与人员和事由"
    min_participants: 2
    description_min_length: 5

  expense_date_validity:
    rule_id: "R006"
    rule_name: "费用时效性"
    description: "费用发生日期必须在报销提交日前90天内"
    max_days_before_submit: 90
    future_dates_allowed: false

  department_quotas:
    rule_id: "R007"
    rule_name: "部门预算配额"
    description: "各部门月度培训和招待费限额"
    training_monthly:
      engineering: 50000.0
      sales: 30000.0
      marketing: 40000.0
      hr: 20000.0
      finance: 10000.0
      operations: 25000.0
      admin: 15000.0
    entertainment_monthly:
      engineering: 20000.0
      sales: 80000.0
      marketing: 50000.0
      hr: 10000.0
      finance: 5000.0
      operations: 15000.0
      admin: 10000.0
